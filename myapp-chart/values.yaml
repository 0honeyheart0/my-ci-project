postgres:
  serviceName: postgres
  port: 5432
  containerPort: 5432
  user: myapp_user
  database: myapp_db
  password: mysecretpassword
  storage:
    size: 1Gi
  image:
    repository: postgres
    tag: git-9791e9e
    pullPolicy: IfNotPresent

app:
  name: myapp
  replicas: 1
  image:
    repository: myapp
    tag: git-9791e9e
    pullPolicy: IfNotPresent
  containerPort: 5000
  servicePort: 80
  jwtSecret: jwt-secret-key
  
imagePullSecrets:
  - name: ghcr-secret
  
backup:
  enabled: true
  schedule: "0 2 * * *"
  storageSize: 1Gi
  retentionDays: 7 

