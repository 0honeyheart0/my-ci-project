apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: myapp-db-creds
  namespace: myapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: myapp-db-secret
  data:
    - secretKey: password
      remoteRef:
        key: myapp/db
        property: password
    - secretKey: username
      remoteRef:
        key: myapp/db
        property: username
