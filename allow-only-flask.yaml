apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-flask
  namespace: myapp
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: myapp
    ports:
    - protocol: TCP
      port: 5432
