---
- name: Deploy Flask app on Yandex Cloud VM
  hosts: web
  become: yes
  vars:
    app_dir: /opt/myapp
    compose_file: docker-compose.yml

  tasks:

    - name: Update 
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: depends
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
          - gnupg
          - lsb-release
          - git
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Install Docker Compose (standalone)
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Add user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy project files
      synchronize:
        src: /home/kali/my-ci-project/
        dest: "{{ app_dir }}"
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.env"
          - "--exclude=*.pyc"
          - "--exclude=venv"
          - "--exclude=.terraform"
          - "--exclude=*.tfstate*"
      delegate_to: 127.0.0.1
      become: false

    - name: Run docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        recreate: always
      register: compose_output

    - name: Show compose output
      debug:
        msg: "{{ compose_output }}"

    - name: Wait for app to be ready
      uri:
        url: http://localhost:5000
        status_code: 200
        timeout: 30
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Show app URL
      debug:
        msg: "Application available at http://{{ ansible_default_ipv4.address }}:5000"
