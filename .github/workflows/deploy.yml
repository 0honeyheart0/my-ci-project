name: Deploy to Minikube

on:
  push:
    branches: [ app, main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=git-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Start Minikube
        run: |
          minikube status || minikube start --driver=docker --cpus=4 --memory=8192
          kubectl config use-context minikube

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and load image into Minikube
        run: |
          docker pull ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}
          minikube image load ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}
          minikube image ls | grep ${{ steps.sha.outputs.short_sha }}

      - name: Update Helm values
        run: |
          cd myapp-chart
          helm upgrade myapp-release . --namespace myapp \
            --set app.image.tag=${{ steps.sha.outputs.short_sha }} \
            --set app.image.pullPolicy=IfNotPresent \
            --reuse-values \
            --install --create-namespace

      - name: Force delete old pods
        run: |
          kubectl delete pod -l app=myapp -n myapp --force --grace-period=0 || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/myapp-flask -n myapp --timeout=5m
          kubectl get pods -n myapp

      - name: Debug if failed
        if: failure()
        run: |
          kubectl describe pod -l app=myapp -n myapp
          kubectl logs -l app=myapp -n myapp --tail=100

      - name: Smoke test
        run: |
          kubectl port-forward -n myapp service/myapp-service 8080:80 &
          sleep 10
          curl -f http://localhost:8080 || (kubectl logs -l app=myapp -n myapp --tail=50 && exit 1)
          kill %1
