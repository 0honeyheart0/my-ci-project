name: Deploy to Minikube

on:
  push:
    branches: [ app, main ]
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches: [app, main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Start Minikube
        run: |
          minikube status || minikube start --driver=docker --cpus=4 --memory=8192
          kubectl config use-context minikube
      - name: Get short SHA
        id: sha
        run: echo "short_sha=git-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Update Helm values
        run: |
          cd myapp-chart
          helm upgrade myapp-release . --namespace myapp \
            --set app.image.tag=${{ steps.sha.outputs.short_sha }} \
            --reuse-values || helm install myapp-release . --namespace myapp --create-namespace \
            --set app.image.tag=${{ steps.sha.outputs.short_sha }}
      - name: Wait for rollout
        run: kubectl rollout status deployment/myapp-flask -n myapp --timeout=2m
      - name: Smoke test
        run: |
          kubectl port-forward -n myapp service/myapp-service 8080:80 &
          sleep 5
          curl -f http://localhost:8080 || exit 1
          kill %1
