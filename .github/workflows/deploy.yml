name: Deploy to Minikube

on:
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches: [app, main]

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get short SHA
        id: sha
        run: echo "short_sha=git-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Start Minikube
        run: |
          minikube status || minikube start --driver=docker --cpus=4 --memory=8192
          kubectl config use-context minikube

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and load image
        run: |
          docker pull ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}
          minikube image load ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}

      - name: Deploy Helm
        run: |
          cd myapp-chart
          helm upgrade --install myapp-release . --namespace myapp --create-namespace \
            --set app.image.tag=${{ steps.sha.outputs.short_sha }} \
            --set app.image.pullPolicy=IfNotPresent

      - name: Wait for ready
        run: kubectl rollout status deployment/myapp-flask -n myapp --timeout=3m

      - name: Smoke test
        run: |
          kubectl port-forward -n myapp service/myapp-service 8080:80 &
          sleep 10
          curl -f http://localhost:8080
