name: Deploy to Minikube

on:
  push:
    branches: [ app, main ]
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches: [app, main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Determine commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            COMMIT_SHA="${{ github.sha }}"
          fi
          echo "short_sha=git-${COMMIT_SHA::7}" >> $GITHUB_OUTPUT
          echo "full_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Start Minikube
        run: |
          minikube status || minikube start --driver=docker --cpus=4 --memory=8192
          kubectl config use-context minikube

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull and load image into Minikube
        run: |
          docker pull ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}
          minikube image load ghcr.io/0honeyheart0/my-ci-project/myapp:${{ steps.sha.outputs.short_sha }}

      - name: Update Helm values
        run: |
          cd myapp-chart
          helm upgrade myapp-release . --namespace myapp \
            --set app.image.tag=${{ steps.sha.outputs.short_sha }} \
            --reuse-values \
            --set imagePullPolicy=IfNotPresent

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/myapp-flask -n myapp --timeout=3m
          kubectl get pods -n myapp

      - name: Smoke test
        run: |
          kubectl port-forward -n myapp service/myapp-service 8080:80 &
          sleep 10
          curl -f http://localhost:8080 || (kubectl logs -n myapp deployment/myapp-flask --tail=50 && exit 1)
          kill %1
