name: Security Scan

on:
  push:
    branches: [ app, main ]

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: docker build -t myapp:latest .

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r . -ll -f html -o bandit-report.html || true

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker image (SARIF)
        run: |
          trivy image --severity HIGH,CRITICAL --format sarif --output trivy-image.sarif myapp:latest

      - name: Scan dependencies (SARIF)
        run: |
          trivy fs --severity HIGH,CRITICAL --format sarif --output trivy-fs.sarif .

      - name: Upload SARIF to GitHub (image)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub (filesystem)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload HTML reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.html
            trivy-image.sarif
            trivy-fs.sarif

