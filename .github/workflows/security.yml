name: Security Scan

on:
  push:
    branches: [app, main]
  workflow_run:
    workflows: ["Build and Publish"]
    types:
      - completed
    branches: [app, main]

jobs:
  security:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Get SHA from build
        id: sha
        run: |
          # Извлекаем короткий хэш из завершённого workflow
          COMMIT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "short_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r . -ll -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker image with Trivy
        run: |
          trivy image --severity HIGH,CRITICAL --no-progress ghcr.io/0honeyheart0/my-ci-project/myapp:git-${{ steps.sha.outputs.short_sha }}

      - name: Scan dependencies with Trivy (fs)
        run: trivy fs --severity HIGH,CRITICAL --no-progress .
